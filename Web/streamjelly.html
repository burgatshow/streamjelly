<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>StreamJelly</title>
</head>
<body>
<div id="StreamJellyPage" data-role="page" class="page type-interior pluginConfigurationPage" data-title="StreamJelly">
<style>
#StreamJellyPage {
    --si-text: #eceef1;
    --si-muted: #9198a1;
    --si-faint: rgba(255,255,255,.07);
    --si-line: rgba(255,255,255,.10);
    --si-surface: rgba(255,255,255,.035);
    --si-direct: #3fd68f;
    --si-copy: #5aa9ff;
    --si-transcode: #ffb23f;
    --si-burn: #ff6f61;
    --si-hw: #b896ff;
    --si-brand: #00a4dc;
}
#StreamJellyPage .si { max-width: 1280px; margin: 0 auto; padding: 1.6em 1.6em 4em; color: var(--si-text); font-variant-numeric: tabular-nums; }
#StreamJellyPage .si * { box-sizing: border-box; }

/* ---------- top bar ---------- */
#StreamJellyPage .si-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.2em 2.5em; margin-bottom: 2em; }
#StreamJellyPage .si-bar h1 { font-size: 1.9em; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
#StreamJellyPage .si-bar .si-sub { color: var(--si-muted); font-size: .9em; margin-top: .35em; }
#StreamJellyPage .si-totals { display: flex; gap: 2.2em; margin-left: auto; }
#StreamJellyPage .si-total b { display: block; font-size: 1.6em; font-weight: 650; line-height: 1.1; }
#StreamJellyPage .si-total span { color: var(--si-muted); font-size: .82em; }
#StreamJellyPage .si-total.is-transcode b { color: var(--si-transcode); }
#StreamJellyPage .si-gear { background: none; border: 1px solid var(--si-line); color: var(--si-muted); border-radius: 8px; padding: .45em .8em; cursor: pointer; font: inherit; font-size: .85em; }
#StreamJellyPage .si-gear:hover, #StreamJellyPage .si-gear[aria-expanded="true"] { color: var(--si-text); border-color: rgba(255,255,255,.25); }
#StreamJellyPage .si-settings { display: none; flex-wrap: wrap; gap: 1em 1.6em; align-items: center; padding: 1em 1.2em; margin: -1em 0 2em; border: 1px solid var(--si-line); border-radius: 10px; font-size: .9em; }
#StreamJellyPage .si-settings.open { display: flex; }
#StreamJellyPage .si-settings label { display: flex; gap: .45em; align-items: center; color: var(--si-muted); }
#StreamJellyPage .si-settings input[type=number] { width: 4.2em; background: var(--si-faint); border: 1px solid var(--si-line); color: var(--si-text); border-radius: 6px; padding: .3em .4em; font: inherit; }
#StreamJellyPage .si-settings .si-save { margin-left: auto; background: var(--si-brand); color: #fff; border: 0; border-radius: 6px; padding: .5em 1.1em; font: inherit; font-weight: 600; cursor: pointer; }

/* ---------- session ---------- */
#StreamJellyPage #siSessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 1.1em; align-items: start; }
#StreamJellyPage .si-session { position: relative; grid-column: 1 / -1; border-radius: 16px; overflow: hidden; margin: .4em 0 1em; background: var(--si-surface); border: 1px solid var(--si-line); }
#StreamJellyPage .si-session.just-opened { animation: si-open .22s ease-out; }
@keyframes si-open { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- compact card ---------- */
#StreamJellyPage .si-card { display: flex; gap: 1em; padding: .85em; border-radius: 14px; background: var(--si-surface); border: 1px solid var(--si-line); cursor: pointer; color: inherit; text-align: left; transition: border-color .15s, background-color .15s; }
#StreamJellyPage .si-card:hover { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.055); }
#StreamJellyPage .si-card:focus-visible { outline: 2px solid var(--si-brand); outline-offset: 2px; }
#StreamJellyPage .si-card-cover { width: 68px; aspect-ratio: 2/3; flex: none; border-radius: 7px; background: var(--si-faint) center/cover; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
#StreamJellyPage .si-card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#StreamJellyPage .si-card-title { font-size: 1.05em; font-weight: 650; line-height: 1.25; margin: .1em 0 .15em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#StreamJellyPage .si-card-top { display: flex; align-items: flex-start; gap: .6em; }
#StreamJellyPage .si-card-top > div { flex: 1; min-width: 0; }
#StreamJellyPage .si-card-mode { flex: none; font-size: .72em; font-weight: 700; padding: .2em .65em; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
#StreamJellyPage .si-card-sub { color: var(--si-muted); font-size: .8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#StreamJellyPage .si-card-who { font-size: .85em; color: #c9ced4; margin-top: .35em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#StreamJellyPage .si-card-who span + span::before { content: ""; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--si-muted); vertical-align: middle; margin: 0 .55em; }
#StreamJellyPage .si-card-progress { margin-top: auto; padding-top: .7em; }
#StreamJellyPage .si-card-progress .si-track { height: 3px; }
#StreamJellyPage .si-card-progress .t { display: flex; justify-content: space-between; font-size: .74em; color: var(--si-muted); margin-top: .35em; }
#StreamJellyPage .si-card.is-paused .si-track b { background: var(--si-muted); }
#StreamJellyPage .si-collapse { background: rgba(255,255,255,.08); border: 0; color: var(--si-text); border-radius: 999px; padding: .4em .9em; font: inherit; font-size: .8em; cursor: pointer; }
#StreamJellyPage .si-collapse:hover { background: rgba(255,255,255,.16); }
#StreamJellyPage .si-hero { position: relative; display: flex; gap: 1.4em; align-items: flex-end; padding: 1.4em 1.6em 1.2em; isolation: isolate; }
#StreamJellyPage .si-hero-bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center 25%; opacity: .38; }
#StreamJellyPage .si-hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,18,22,.96) 0%, rgba(16,18,22,.75) 45%, rgba(16,18,22,.35) 100%), linear-gradient(0deg, rgba(16,18,22,1) 0%, rgba(16,18,22,0) 60%); }
#StreamJellyPage .si-poster { width: 92px; aspect-ratio: 2/3; border-radius: 8px; background: var(--si-faint) center/cover; flex: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#StreamJellyPage .si-heading { min-width: 0; flex: 1; }
#StreamJellyPage .si-series { color: var(--si-muted); font-size: .92em; margin-bottom: .15em; }
#StreamJellyPage .si-name { font-size: 1.55em; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin: 0 0 .55em; }
#StreamJellyPage .si-who { display: flex; flex-wrap: wrap; gap: .4em; }
#StreamJellyPage .si-chip { font-size: .8em; padding: .25em .65em; border-radius: 999px; background: rgba(255,255,255,.08); color: #d5d9de; white-space: nowrap; }
#StreamJellyPage .si-preview { flex: none; align-self: center; width: 256px; text-align: center; }
#StreamJellyPage .si-preview-img { width: 100%; border-radius: 8px; background-color: rgba(0,0,0,.4); background-repeat: no-repeat; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#StreamJellyPage .si-preview-cap { font-size: .75em; color: var(--si-muted); margin-top: .4em; }
#StreamJellyPage .si-preview-none { font-size: .78em; color: var(--si-muted); max-width: 200px; text-align: center; }
#StreamJellyPage .si-mode { text-align: right; flex: none; align-self: flex-start; }
#StreamJellyPage .si-actions { display: flex; gap: .6em; align-items: center; justify-content: flex-end; }
#StreamJellyPage .si-mode-name { display: inline-block; font-weight: 700; font-size: .95em; padding: .35em .85em; border-radius: 999px; border: 1.5px solid currentColor; }
#StreamJellyPage .si-mode-note { color: var(--si-muted); font-size: .8em; margin-top: .45em; }
#StreamJellyPage .m-DirectPlay { color: var(--si-direct); }
#StreamJellyPage .m-DirectStream { color: var(--si-copy); }
#StreamJellyPage .m-Transcode { color: var(--si-transcode); }
#StreamJellyPage .m-Unknown { color: var(--si-muted); }

#StreamJellyPage .si-time { display: flex; align-items: center; gap: .9em; padding: 0 1.6em 1.2em; font-size: .82em; color: var(--si-muted); }
#StreamJellyPage .si-track { position: relative; flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
#StreamJellyPage .si-track i { position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.18); }
#StreamJellyPage .si-track b { position: absolute; inset: 0 auto 0 0; background: var(--si-brand); border-radius: 4px; }
#StreamJellyPage .si-paused { color: var(--si-text); font-weight: 600; }

/* ---------- streams: one row per stream ---------- */
#StreamJellyPage .si-lane { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: .2em 1em; padding: .8em 0; border-top: 1px solid var(--si-faint); --c: var(--si-muted); }
#StreamJellyPage .si-path .si-lane:first-child { border-top: 0; padding-top: .3em; }
#StreamJellyPage .si-lane.d-Direct { --c: var(--si-direct); }
#StreamJellyPage .si-lane.d-Copy, #StreamJellyPage .si-lane.d-Separate { --c: var(--si-copy); }
#StreamJellyPage .si-lane.d-Transcode { --c: var(--si-transcode); }
#StreamJellyPage .si-lane.d-BurnIn { --c: var(--si-burn); }
#StreamJellyPage .si-lk { color: var(--si-muted); font-size: .85em; padding-top: .15em; }
#StreamJellyPage .si-lk small { display: block; font-size: .9em; opacity: .8; }
#StreamJellyPage .si-lv { display: flex; flex-wrap: wrap; align-items: center; gap: .3em .7em; font-size: 1.05em; font-weight: 650; }
#StreamJellyPage .si-out { color: var(--c); }
#StreamJellyPage .si-flow { position: relative; width: 44px; height: 12px; flex: none; }
#StreamJellyPage .si-flow::before { content: ""; position: absolute; left: 0; right: 4px; top: 50%; height: 2px; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 10px); opacity: .7; }
#StreamJellyPage .si-flow::after { content: ""; position: absolute; right: 1px; top: 50%; width: 7px; height: 7px; border-top: 2px solid var(--c); border-right: 2px solid var(--c); transform: translateY(-50%) rotate(45deg); }
#StreamJellyPage .si-session.is-live .si-flow::before { animation: si-flow .9s linear infinite; }
#StreamJellyPage .si-node { color: var(--c); border: 1.5px solid var(--c); border-radius: 999px; padding: .1em .65em; font-size: .72em; font-weight: 700; white-space: nowrap; }
#StreamJellyPage .si-ls { grid-column: 2; font-size: .84em; color: #b8bec6; }
#StreamJellyPage .si-ls span { color: var(--si-muted); display: inline-block; min-width: 7.5em; }
@keyframes si-flow { from { background-position: 0 0; } to { background-position: 10px 0; } }
@media (prefers-reduced-motion: reduce) { #StreamJellyPage .si-session.is-live .si-flow::before { animation: none; } }

#StreamJellyPage .si-report { padding: .8em 0 0; margin-top: .2em; border-top: 1px solid var(--si-faint); font-size: .82em; color: var(--si-muted); }
#StreamJellyPage .si-report.stale { color: #ffd08a; }
#StreamJellyPage .si-reasons { display: flex; flex-wrap: wrap; gap: .45em; align-items: center; padding: .8em 0 0; font-size: .85em; }
#StreamJellyPage .si-reasons > span:first-child { color: var(--si-muted); margin-right: .2em; }
#StreamJellyPage .si-reason { padding: .25em .7em; border-radius: 6px; background: rgba(255,178,63,.12); color: #ffd08a; }

/* ---------- body: streams panel + live panel ---------- */
#StreamJellyPage .si-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1em; padding: 0 1.6em 1.4em; }
#StreamJellyPage .si-panel { border: 1px solid var(--si-line); border-radius: 12px; padding: 1em 1.2em 1.1em; background: rgba(255,255,255,.02); min-width: 0; }
#StreamJellyPage .si-panel > h3 { font-size: .95em; font-weight: 650; margin: 0 0 .5em; }
#StreamJellyPage .si-panel .si-preview { width: 100%; max-width: 360px; margin: .2em 0 1em; text-align: left; }
#StreamJellyPage .si-panel .si-preview-none { max-width: none; text-align: left; margin-bottom: .8em; }
#StreamJellyPage .si-live { display: grid; grid-template-columns: 1fr auto; gap: 0; margin: 0; font-size: .9em; max-width: 560px; }
#StreamJellyPage .si-live dt, #StreamJellyPage .si-live dd { padding: .5em 0; border-top: 1px solid var(--si-faint); }
#StreamJellyPage .si-live dt:first-of-type, #StreamJellyPage .si-live dt:first-of-type + dd { border-top: 0; }
#StreamJellyPage .si-live dd { text-align: right; font-weight: 650; }
#StreamJellyPage .si-live dd.hw { color: var(--si-hw); }
#StreamJellyPage .si-live dd.warn { color: var(--si-burn); }

/* ---------- details as tabs ---------- */
#StreamJellyPage .si-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: .35em; padding: .9em 1.6em; border-top: 1px solid var(--si-line); }
#StreamJellyPage .si-tabs-label { color: var(--si-muted); font-size: .85em; align-self: center; margin-right: .5em; }
#StreamJellyPage .si-tab { background: none; border: 1px solid transparent; color: var(--si-muted); border-radius: 999px; padding: .35em .9em; font: inherit; font-size: .85em; cursor: pointer; }
#StreamJellyPage .si-tab:hover { color: var(--si-text); background: rgba(255,255,255,.05); }
#StreamJellyPage .si-tab[aria-selected="true"] { color: var(--si-text); background: rgba(255,255,255,.09); border-color: var(--si-line); }
#StreamJellyPage .si-tabpanel { padding: 0 1.6em 1.5em; }
#StreamJellyPage dl { display: grid; grid-template-columns: max-content 1fr; gap: .3em 1.1em; margin: 0; font-size: .88em; }
#StreamJellyPage dt { color: var(--si-muted); }
#StreamJellyPage dd { margin: 0; word-break: break-word; }
#StreamJellyPage .si-table-wrap { overflow-x: auto; }
#StreamJellyPage table { width: 100%; border-collapse: collapse; font-size: .85em; }
#StreamJellyPage th { text-align: left; font-weight: 600; color: var(--si-muted); padding: .4em .7em; border-bottom: 1px solid var(--si-line); }
#StreamJellyPage td { padding: .5em .7em; border-bottom: 1px solid var(--si-faint); vertical-align: top; }
#StreamJellyPage tr.on td { background: rgba(0,164,220,.08); }
#StreamJellyPage tr.on td:first-child { box-shadow: inset 3px 0 var(--si-brand); }
#StreamJellyPage tr.off td { color: var(--si-muted); }
#StreamJellyPage .si-sgroups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.2em; }
#StreamJellyPage .si-sgroup h4 { margin: 0 0 .5em; font-size: .9em; font-weight: 650; }
#StreamJellyPage .si-sgroup h4 span { color: var(--si-muted); font-weight: 400; }
#StreamJellyPage .si-srow { display: grid; grid-template-columns: 2.2em 1fr; gap: .2em .6em; padding: .6em .7em; border-radius: 8px; margin-bottom: .35em; background: rgba(255,255,255,.025); border: 1px solid transparent; }
#StreamJellyPage .si-srow.on { background: rgba(0,164,220,.09); border-color: rgba(0,164,220,.35); }
#StreamJellyPage .si-srow.off { opacity: .62; }
#StreamJellyPage .si-sidx { color: var(--si-muted); font-size: .85em; padding-top: .1em; }
#StreamJellyPage .si-sline { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3em .6em; }
#StreamJellyPage .si-sname { font-weight: 650; }
#StreamJellyPage .si-slang { font-size: .78em; padding: .1em .5em; border-radius: 4px; background: rgba(255,255,255,.08); text-transform: lowercase; }
#StreamJellyPage .si-stitle { color: var(--si-muted); font-size: .88em; }
#StreamJellyPage .si-inuse { margin-left: auto; font-size: .72em; font-weight: 700; color: var(--si-brand); border: 1.5px solid currentColor; border-radius: 999px; padding: .1em .55em; }
#StreamJellyPage .si-sfeat { grid-column: 2; font-size: .8em; color: #b8bec6; }
#StreamJellyPage .si-cmd { position: relative; }
#StreamJellyPage .si-cmd pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: .76em; line-height: 1.55; background: rgba(0,0,0,.35); padding: 2.6em 1.1em 1em; border-radius: 8px; max-height: 280px; overflow: auto; color: #c9d1d9; }
#StreamJellyPage .si-cmd pre .opt { color: #7fc8ff; }
#StreamJellyPage .si-copy { position: absolute; top: .5em; right: .6em; background: rgba(255,255,255,.08); color: var(--si-text); border: 0; border-radius: 6px; padding: .3em .7em; font: inherit; font-size: .75em; cursor: pointer; }

#StreamJellyPage .si-empty { text-align: center; padding: 5em 1em; color: var(--si-muted); }
#StreamJellyPage .si-empty b { display: block; color: var(--si-text); font-size: 1.2em; margin-bottom: .4em; }
#StreamJellyPage .si-error { padding: 1em 1.2em; border-radius: 10px; background: rgba(255,111,97,.12); color: #ffb3aa; margin-bottom: 1.5em; }
#StreamJellyPage button:focus-visible, #StreamJellyPage summary:focus-visible, #StreamJellyPage .si-card:focus-visible, #StreamJellyPage input:focus-visible { outline: 2px solid var(--si-brand); outline-offset: 2px; }

@media (max-width: 760px) {
    #StreamJellyPage .si { padding: 1em .8em 3em; }
    #StreamJellyPage .si-totals { margin-left: 0; }
    #StreamJellyPage .si-hero { flex-wrap: wrap; padding: 1.2em; }
    #StreamJellyPage .si-poster { width: 64px; }
    #StreamJellyPage .si-preview { width: 100%; max-width: 320px; }
    #StreamJellyPage .si-mode { text-align: left; width: 100%; }
    #StreamJellyPage .si-time, #StreamJellyPage .si-tabs, #StreamJellyPage .si-tabpanel { padding-left: 1.2em; padding-right: 1.2em; }
    #StreamJellyPage .si-body { padding: 0 1.2em 1.2em; }
    #StreamJellyPage .si-lane { grid-template-columns: 1fr; }
    #StreamJellyPage .si-ls { grid-column: 1; }
    #StreamJellyPage .si-ls span { display: block; min-width: 0; }
    #StreamJellyPage .si-actions { justify-content: flex-start; }
}
</style>

<div data-role="content">
<div class="content-primary si">

    <header class="si-bar">
        <div>
            <h1>StreamJelly</h1>
            <div class="si-sub" id="siStatus" data-i18n="loading">Loading…</div>
        </div>
        <div class="si-totals" id="siTotals"></div>
        <button type="button" class="si-gear" id="siGear" aria-expanded="false" aria-controls="siSettings" data-i18n="settings">Settings</button>
    </header>

    <div class="si-settings" id="siSettings">
        <label><input type="checkbox" id="siAuto" checked> <span data-i18n="auto_refresh">Auto refresh</span></label>
        <label><span data-i18n="interval">Every</span> <input type="number" id="siInterval" min="1" max="60" value="3"> <span data-i18n="sec">s</span></label>
        <label><input type="checkbox" id="siShowPaths"> <span data-i18n="show_paths">Show file paths</span></label>
        <label><input type="checkbox" id="siShowCmd"> <span data-i18n="show_cmd">Show ffmpeg command</span></label>
        <label><input type="checkbox" id="siShowPreview"> <span data-i18n="show_preview">Show approximate preview</span></label>
        <button type="button" class="si-save" id="siSave" data-i18n="save">Save</button>
    </div>

    <div id="siError"></div>
    <div id="siSessions"></div>
</div>
</div>

        var tabs = [];
        if (src) {
            tabs.push({ id: 'source', label: t('h_source'), html: '<dl>'
                + dl(t('st_container'), src.container) + dl(t('size'), bytes(src.size)) + dl(t('bitrate'), mbps(src.bitrate))
                + dl(t('type'), src.videoType) + dl(t('protocol'), src.protocol)
                + dl(t('playable'), join([src.supportsDirectPlay ? t('pl_direct') : '', src.supportsDirectStream ? t('pl_remux') : '', src.supportsTranscoding ? t('pl_transcode') : ''], ', '))
                + dl(t('path'), src.path) + '</dl>' });
        }
        tabs.push({ id: 'output', label: t('h_output'), html: '<dl>'
            + dl(t('st_container'), o.container) + dl(t('video'), codec(o.videoCodec)) + dl(t('resolution'), o.width && o.height ? o.width + ' × ' + o.height : '')
            + dl(t('framerate'), fps(o.framerate)) + dl(t('audio'), codec(o.audioCodec)) + dl(t('channels'), channels(o.audioChannels))
            + dl(t('bitrate'), mbps(o.bitrate)) + '</dl>' });
        if (job) {
            var hi = job.hints || {};
            tabs.push({ id: 'ffmpeg', label: 'ffmpeg', html: '<dl>'
                + dl(t('process'), join([job.type === 'Hls' ? 'HLS' : job.type, job.processId ? 'PID ' + job.processId : ''], ', '))
                + dl(t('venc'), join([hi.videoEncoder, hi.preset ? 'preset ' + hi.preset : '', hi.crf ? 'CRF ' + hi.crf : ''], ', '))
                + dl(t('vbr'), join([hi.videoBitrate ? mbps(+hi.videoBitrate) : '', hi.maxRate ? 'max ' + mbps(+hi.maxRate) : ''], ', '))
                + dl(t('aenc'), join([hi.audioEncoder, hi.audioBitrate ? mbps(+hi.audioBitrate) : '', hi.audioChannels ? t('ch_n', { n: hi.audioChannels }) : ''], ', '))
                + dl(t('segments'), join([hi.segmentFormat, hi.segmentLength ? hi.segmentLength + ' ' + t('sec') : ''], ', '))
                + dl(t('transcoded_data'), bytes(job.bytesTranscoded))
                + dl(t('throttling'), job.throttlingEnabled ? t('enabled') : '')
                + dl(t('outfile'), job.outputPath) + '</dl>' });
        }
        if (src && src.streams && src.streams.length) {
            tabs.push({ id: 'streams', label: t('tab_streams') + ' (' + src.streams.length + ')', html: streamGroups(src.streams) });
        }
        if (job && job.ffmpegCommand) {
            tabs.push({ id: 'cmd', label: t('tab_cmd'), html: '<div class="si-cmd"><button type="button" class="si-copy" data-cmd="' + esc(job.ffmpegCommand) + '">' + esc(t('copy')) + '</button><pre>'
                + esc(job.ffmpegCommand).replace(/(^|\s)(-[a-z_:0-9]+)/gi, '$1<span class="opt">$2</span>') + '</pre></div>' });
        }
        return tabs;
    }
    /** Approximate picture of the playback position: one thumbnail cropped out of a trickplay tile sheet. */
    function preview(s) {
        var p = s.preview;
        if (!p) return '';
        if (!p.available) return '<div class="si-preview"><div class="si-preview-none">' + esc(t('no_trickplay')) + '</div></div>';
        var url = ApiClient.getUrl('Videos/' + p.itemId + '/Trickplay/' + p.width + '/' + p.tileIndex + '.jpg', { ApiKey: ApiClient.accessToken() });
        var x = p.tileColumns > 1 ? p.column / (p.tileColumns - 1) * 100 : 0;
        var y = p.tileRows > 1 ? p.row / (p.tileRows - 1) * 100 : 0;
        return '<div class="si-preview"><div class="si-preview-img" style="aspect-ratio:' + p.width + '/' + p.height
            + ';background-image:url(\'' + url + '\');background-size:' + (p.tileColumns * 100) + '% ' + (p.tileRows * 100) + '%'
            + ';background-position:' + x.toFixed(4) + '% ' + y.toFixed(4) + '%"></div>'
            + '<div class="si-preview-cap">' + esc(t('preview_cap', { t: clock(p.positionTicks) })) + '</div></div>';
    }
    function report(s) {
        if (!s.hasProgressReport) return '<div class="si-report stale">' + esc(t('no_report')) + '</div>';
        var ago = Math.max(0, Math.round((Date.now() - new Date(s.lastReportUtc).getTime()) / 1000));
        var subOff = s.selectedSubtitleIndex === null || s.selectedSubtitleIndex === undefined || s.selectedSubtitleIndex < 0;
        var txt = t('report', {
            ago: ago < 60 ? ago + ' ' + t('sec') : Math.round(ago / 60) + ' ' + t('min'),
            a: s.selectedAudioIndex !== null && s.selectedAudioIndex !== undefined ? '#' + s.selectedAudioIndex : t('not_set'),
            s: subOff ? t('off') : '#' + s.selectedSubtitleIndex
        });
        if (ago > 30 && !s.isPaused) txt += t('report_stale');
        return '<div class="si-report' + (ago > 30 && !s.isPaused ? ' stale' : '') + '">' + esc(txt) + '</div>';
    }
    function dl(k, v) { return v ? '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>' : ''; }
    /** The properties of a stream, as short items. */
    function featureList(st) {
        var p = [];
        if (st.type === 'Video') p = [st.width && st.height ? st.width + '×' + st.height + (st.isInterlaced ? 'i' : 'p') : '', fps(st.frameRate), st.bitDepth ? st.bitDepth + ' bit' : '', range(st.videoRangeType), st.dvProfile ? 'DV ' + st.dvProfile : '', st.pixelFormat, mbps(st.bitRate)];
        else if (st.type === 'Audio') p = [st.sampleRate ? (st.sampleRate / 1000).toString().replace('.', DEC) + ' kHz' : '', st.bitDepth ? st.bitDepth + ' bit' : '', mbps(st.bitRate)];
        p = p.concat([st.isDefault ? t('default_') : '', st.isForced ? t('forced') : '', st.isExternal ? t('external') : '', st.isHearingImpaired ? 'SDH' : '', st.path || '']);
        return p.filter(function (x) { return x; });
    }
    /** Every stream of the file, grouped by type; the ones in use first and marked. */
    function streamGroups(streams) {
        var order = ['Video', 'Audio', 'Subtitle'];
        var types = [];
        streams.forEach(function (st) { if (types.indexOf(st.type) < 0) types.push(st.type); });
        types.sort(function (a, b) { return (order.indexOf(a) < 0 ? 9 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 9 : order.indexOf(b)); });
        return '<div class="si-sgroups">' + types.map(function (type) {
            var list = streams.filter(function (st) { return st.type === type; })
                .sort(function (a, b) { return (b.isActive ? 1 : 0) - (a.isActive ? 1 : 0) || a.index - b.index; });
            return '<div class="si-sgroup"><h4>' + esc(kindName[type] || type) + ' <span>' + list.length + '</span></h4>' + list.map(function (st) {
                var name = type === 'Video' ? join([res(st.width, st.height), codec(st.codec), st.profile], ' ')
                    : type === 'Audio' ? join([codec(st.codec), channels(st.channels, st.channelLayout)], ' ')
                    : codec(st.codec);
                var feats = featureList(st);
                if (type === 'Audio' && st.profile && st.profile !== st.codec) feats.unshift(st.profile);
                return '<div class="si-srow ' + (st.isActive ? 'on' : 'off') + '"><div class="si-sidx">#' + st.index + '</div>'
                    + '<div class="si-sline"><span class="si-sname">' + esc(name || st.codec || '') + '</span>'
                    + (st.language ? '<span class="si-slang">' + esc(st.language) + '</span>' : '')
                    + (st.title ? '<span class="si-stitle">' + esc(st.title) + '</span>' : '')
                    + (st.isActive ? '<span class="si-inuse">' + esc(t('in_use')) + '</span>' : '') + '</div>'
                    + (feats.length ? '<div class="si-sfeat">' + esc(feats.join('  ·  ')) + '</div>' : '')
                    + '</div>';
            }).join('') + '</div>';
        }).join('') + '</div>';
    }

    /* ---------- page ---------- */
    function remember() {
        page.querySelectorAll('details[data-did]').forEach(function (d) { openState[d.getAttribute('data-did')] = d.open; });
    }
    function updateRates(list) {
        var now = Date.now();
        list.forEach(function (s) {
            (s.jobs || []).forEach(function (j) {
                var key = j.id || s.sessionId, prev = prevBytes[key];
                if (prev && now - prev.t > 500 && j.bytesDownloaded >= prev.bytes) {
                    var r = 8 * (j.bytesDownloaded - prev.bytes) / ((now - prev.t) / 1000);
                    rates[key] = rates[key] ? rates[key] * 0.5 + r * 0.5 : r;
                }
                prevBytes[key] = { bytes: j.bytesDownloaded, t: now };
            });
        });
    }
    function totals(list) {
        var tr = list.filter(function (s) { return (s.output || {}).mode === 'Transcode'; }).length;
        var bw = 0;
        list.forEach(function (s) { (s.jobs || []).forEach(function (j) { bw += rates[j.id || s.sessionId] || 0; }); });
        return '<div class="si-total"><b>' + list.length + '</b><span>' + esc(t('tot_play')) + '</span></div>'
            + '<div class="si-total' + (tr ? ' is-transcode' : '') + '"><b>' + tr + '</b><span>' + esc(t('tot_tr')) + '</span></div>'
            + (bw ? '<div class="si-total"><b>' + mbps(bw) + '</b><span>' + esc(t('tot_bw')) + '</span></div>' : '');
    }

    function load() {
        if (!document.body.contains(page)) { stop(); return; }
        ApiClient.getJSON(ApiClient.getUrl('StreamJelly/Sessions')).then(function (data) {
            var list = data.sessions || [];
            remember();
            updateRates(list);
            page.querySelector('#siError').innerHTML = '';
            page.querySelector('#siTotals').innerHTML = totals(list);
            lastList = list;
            render();
            page.querySelector('#siStatus').textContent = t('status', { v: data.serverVersion || '', t: new Date(data.generatedAtUtc).toLocaleTimeString(LANG === 'hu' ? 'hu-HU' : undefined) })
                + (data.transcodeJobsAvailable ? '' : t('no_jobs'));
        }, function (err) {
            page.querySelector('#siError').innerHTML = '<div class="si-error">' + esc(t('error', { e: err && err.status ? 'HTTP ' + err.status : String(err) })) + '</div>';
        });
    }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function start() {
        stop();
        load();
        if (page.querySelector('#siAuto').checked) {
            var sec = Math.max(1, Math.min(60, parseInt(page.querySelector('#siInterval').value, 10) || 3));
            timer = setInterval(load, sec * 1000);
        }
    }
    function loadConfig() {
        return ApiClient.getPluginConfiguration(pluginId).then(function (cfg) {
            page.querySelector('#siInterval').value = cfg.RefreshSeconds || 3;
            page.querySelector('#siShowPaths').checked = !!cfg.ShowPaths;
            page.querySelector('#siShowCmd').checked = !!cfg.ShowFfmpegCommand;
            page.querySelector('#siShowPreview').checked = !!cfg.ShowPreview;
        }, function () { });
    }

    page.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });

    page.querySelector('#siGear').addEventListener('click', function () {
        var p = page.querySelector('#siSettings'), open = !p.classList.contains('open');
        p.classList.toggle('open', open);
        this.setAttribute('aria-expanded', open);
    });
    page.querySelector('#siSave').addEventListener('click', function () {
        var btn = this;
        ApiClient.getPluginConfiguration(pluginId).then(function (cfg) {
            cfg.RefreshSeconds = parseInt(page.querySelector('#siInterval').value, 10) || 3;
            cfg.ShowPaths = page.querySelector('#siShowPaths').checked;
            cfg.ShowFfmpegCommand = page.querySelector('#siShowCmd').checked;
            cfg.ShowPreview = page.querySelector('#siShowPreview').checked;
            return ApiClient.updatePluginConfiguration(pluginId, cfg);
        }).then(function () {
            btn.textContent = t('saved');
            setTimeout(function () { btn.textContent = t('save'); }, 1500);
            start();
        });
    });
    page.querySelector('#siAuto').addEventListener('change', start);
    page.querySelector('#siInterval').addEventListener('change', start);
    page.querySelector('#siSessions').addEventListener('keydown', function (e) {
        var c = e.target.closest('.si-card[data-toggle]');
        if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(c.getAttribute('data-toggle')); }
    });
    page.querySelector('#siSessions').addEventListener('click', function (e) {
        var tg = e.target.closest('[data-toggle]');
        if (tg) { toggle(tg.getAttribute('data-toggle')); return; }
        var tab = e.target.closest('.si-tab');
        if (tab) {
            var sid = tab.getAttribute('data-sid'), id = tab.getAttribute('data-tab');
            tabState[sid] = tabState[sid] === id ? null : id;
            render();
            var again = page.querySelector('.si-tab[data-sid="' + (window.CSS && CSS.escape ? CSS.escape(sid) : sid) + '"][data-tab="' + id + '"]');
            if (again) again.focus();
            return;
        }
        var b = e.target.closest('.si-copy');
        if (!b) return;
        navigator.clipboard.writeText(b.getAttribute('data-cmd')).then(function () {
            b.textContent = t('copied');
            setTimeout(function () { b.textContent = t('copy'); }, 1500);
        });
    });

    page.addEventListener('pageshow', function () { loadConfig().then(start); });
    page.addEventListener('pagehide', stop);
    page.addEventListener('viewhide', stop);
    loadConfig().then(start);
})();
</script>
</div>
</body>
</html>
