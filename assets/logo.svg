<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="dome" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#efe4ff"/>
      <stop offset=".38" stop-color="#b993ff"/>
      <stop offset=".78" stop-color="#7d6cf5"/>
      <stop offset="1" stop-color="#5b5bd6"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3f3aa8" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="tG" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="490">
      <stop offset="0" stop-color="#3fd68f"/><stop offset="1" stop-color="#3fd68f" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="tB" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="500">
      <stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#5aa9ff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="tO" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="490">
      <stop offset="0" stop-color="#ffb23f"/><stop offset="1" stop-color="#ffb23f" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="tP" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="470">
      <stop offset="0" stop-color="#ffd6ea" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- thin pastel tentacles -->
  <g fill="none" stroke="url(#tP)" stroke-width="7" stroke-linecap="round">
    <path d="M150 272 C138 320 166 350 150 395 C138 430 156 450 146 470"/>
    <path d="M228 284 C220 330 244 360 230 405 C220 440 238 460 230 478"/>
    <path d="M284 284 C292 330 268 360 282 405 C292 440 274 460 282 478"/>
    <path d="M362 272 C374 320 346 350 362 395 C374 430 356 450 366 470"/>
  </g>

  <!-- the three stream tentacles: direct (green), copy (blue), transcode (orange) -->
  <g fill="none" stroke-linecap="round" stroke-width="20">
    <path stroke="url(#tG)" d="M192 280 C176 330 214 360 196 410 C184 444 204 466 192 490"/>
    <path stroke="url(#tB)" d="M256 288 C240 340 276 372 256 424 C244 456 266 478 256 500"/>
    <path stroke="url(#tO)" d="M320 280 C336 330 298 360 316 410 C328 444 308 466 320 490"/>
  </g>

  <!-- bell -->
  <path fill="url(#dome)" d="M88 252 C88 140 164 64 256 64 C348 64 424 140 424 252 C424 274 404 282 386 274 C364 264 346 286 322 280 C300 274 282 296 256 290 C230 296 212 274 190 280 C166 286 148 264 126 274 C108 282 88 274 88 252 Z"/>
  <path fill="url(#rim)" d="M88 252 C88 140 164 64 256 64 C348 64 424 140 424 252 C424 274 404 282 386 274 C364 264 346 286 322 280 C300 274 282 296 256 290 C230 296 212 274 190 280 C166 286 148 264 126 274 C108 282 88 274 88 252 Z"/>
  <!-- gloss -->
  <ellipse cx="186" cy="124" rx="62" ry="30" fill="#fff" opacity=".55" transform="rotate(-24 186 124)" filter="url(#soft)"/>
  <ellipse cx="170" cy="120" rx="20" ry="9" fill="#fff" opacity=".9" transform="rotate(-28 170 120)"/>

  <!-- face -->
  <ellipse cx="200" cy="214" rx="20" ry="11" fill="#ff8fb8" opacity=".45"/>
  <ellipse cx="312" cy="214" rx="20" ry="11" fill="#ff8fb8" opacity=".45"/>
  <g fill="#2a2457">
    <ellipse cx="214" cy="184" rx="15" ry="19"/>
    <ellipse cx="298" cy="184" rx="15" ry="19"/>
  </g>
  <g fill="#fff">
    <circle cx="219" cy="177" r="5.5"/><circle cx="303" cy="177" r="5.5"/>
    <circle cx="209" cy="192" r="2.5"/><circle cx="293" cy="192" r="2.5"/>
  </g>
  <path d="M240 214 Q256 230 272 214" fill="none" stroke="#2a2457" stroke-width="6" stroke-linecap="round"/>
</svg>
